<svg xmlns="http://www.w3.org/2000/svg" width="860" height="248" viewBox="0 0 860 248">
<rect width="860" height="248" fill="#0f1115"/>
<text x="24" y="36" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui,sans-serif">PAR-1 — No table view type</text>
<line x1="24" y1="52" x2="836" y2="52" stroke="#243040"/>
<text x="24" y="76" fill="#7dd3fc" font-size="12" font-weight="600" font-family="system-ui,sans-serif">NOTION</text>
<text x="438" y="76" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui,sans-serif">CLOSOT</text>
<line x1="422" y1="60" x2="422" y2="196" stroke="#243040"/>
<text x="24" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">view 'all'    = table</text><text x="24" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">view 'Table'  = table</text><text x="24" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">Ideas         = table</text><text x="24" y="162" fill="#4ade80" font-size="13" font-family="ui-monospace,Menlo,monospace">renders rows in a grid</text>
<text x="438" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">viewType 'table' persists,</text><text x="438" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">but the board renders EMPTY —</text><text x="438" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">no rows, no columns, no error.</text><text x="438" y="162" fill="#ff6b6b" font-size="13" font-family="ui-monospace,Menlo,monospace">reverted all three to 'list'</text>

<text x="24" y="228" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">Render switch handles board | calendar | chart | forms | gallery | list only. No tableView component.</text>
</svg>