<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270">
<rect width="860" height="270" fill="#0f1115"/>
<text x="24" y="36" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui,sans-serif">PAR-4 — status type has no option groups</text>
<line x1="24" y1="52" x2="836" y2="52" stroke="#243040"/>
<text x="24" y="76" fill="#7dd3fc" font-size="12" font-weight="600" font-family="system-ui,sans-serif">NOTION</text>
<text x="438" y="76" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui,sans-serif">CLOSOT</text>
<line x1="422" y1="60" x2="422" y2="218" stroke="#243040"/>
<text x="24" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">type: status</text><text x="24" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">groups: To-do [Not started]</text><text x="24" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">        In progress [In progress]</text><text x="24" y="162" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">        Complete [Done]</text><text x="24" y="184" fill="#4ade80" font-size="13" font-family="ui-monospace,Menlo,monospace">filters key off the GROUP</text>
<text x="438" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">type: status exists, but flat —</text><text x="438" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">options only, no group layer.</text><text x="438" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">Group-based filtering cannot be</text><text x="438" y="162" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">expressed at all.</text><text x="438" y="184" fill="#ff6b6b" font-size="13" font-family="ui-monospace,Menlo,monospace">seeded names also differ: 'To Do'</text>

<text x="24" y="250" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">Notion's done/overdue views filter on 'status is group Complete'.</text>
</svg>