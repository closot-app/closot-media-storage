<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270">
<rect width="860" height="270" fill="#0f1115"/>
<text x="24" y="36" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui,sans-serif">PAR-2 — Relative-date filters unsupported</text>
<line x1="24" y1="52" x2="836" y2="52" stroke="#243040"/>
<text x="24" y="76" fill="#7dd3fc" font-size="12" font-weight="600" font-family="system-ui,sans-serif">NOTION</text>
<text x="438" y="76" fill="#fbbf24" font-size="12" font-weight="600" font-family="system-ui,sans-serif">CLOSOT</text>
<line x1="422" y1="60" x2="422" y2="218" stroke="#243040"/>
<text x="24" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">'this month'  date is within this month</text><text x="24" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">'overdue'     date on-or-before today</text><text x="24" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">              + status is group Complete</text><text x="24" y="162" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">'done'        status is group Complete</text><text x="24" y="184" fill="#4ade80" font-size="13" font-family="ui-monospace,Menlo,monospace">views show only matching rows</text>
<text x="438" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">advancedFilterUtils operators:</text><text x="438" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">equals / contains / greater_than /</text><text x="438" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">is_empty ... all ABSOLUTE values.</text><text x="438" y="162" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">No today / this-week / this-month.</text><text x="438" y="184" fill="#ff6b6b" font-size="13" font-family="ui-monospace,Menlo,monospace">tabs exist but show every row</text>

<text x="24" y="250" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">Deliberately not faked with hardcoded dates — they would silently go stale.</text>
</svg>