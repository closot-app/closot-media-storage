<text x="24" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">countIf("all tasks", ...) computes</text><text x="24" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">wherever the formula renders</text><text x="24" y="140" fill="#4ade80" font-size="13" font-family="ui-monospace,Menlo,monospace">always resolves related rows</text>
<text x="438" y="96" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">createBoardRelationResolver reads</text><text x="438" y="118" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">already-loaded board state only;</text><text x="438" y="140" fill="#cbd5e1" font-size="13" font-family="ui-monospace,Menlo,monospace">unhydrated linked ds -> cell error</text><text x="438" y="162" fill="#ff6b6b" font-size="13" font-family="ui-monospace,Menlo,monospace">'related rows not loaded yet'</text>

<text x="24" y="228" fill="#64748b" font-size="12" font-family="system-ui,sans-serif">Works on the Homepage only because both boards share the page. Fix: fetch on demand.</text>
